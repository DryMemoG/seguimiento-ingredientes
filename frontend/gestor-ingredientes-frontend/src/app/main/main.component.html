<div class="main-container">
    <mat-grid-list cols="3" rowHeight="1:1">
        <mat-grid-tile *ngFor="let module of modules">
            <mat-card>
                <mat-card-header>
                    <mat-card-title>{{ module.title }}</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <p>{{ module.description }}</p>
                </mat-card-content>
                <mat-card-actions>
                    <button mat-button (click)="navigateTo(module.route)">Ir al módulo</button>
                </mat-card-actions>
            </mat-card>
        </mat-grid-tile>
    </mat-grid-list>
</div>
